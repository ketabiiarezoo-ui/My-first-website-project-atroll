<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATROLL | درب اتوماتیک و کرکره برقی</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, 'Segoe UI', sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            text-align: center;
            padding: 30px 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        h1 {
            color: #0f172a;
            font-size: 26px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .services {
            text-align: right;
            background: #f1f5f9;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .services h2 {
            font-size: 17px;
            margin-bottom: 12px;
            color: #334155;
        }
        .services ul {
            list-style: none;
            padding-right: 5px;
        }
        .services li {
            padding: 6px 0;
            font-size: 14px;
            color: #475569;
        }
        .btn-call {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            transition: 0.2s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>برند ATROLL</h1>
        <p class="subtitle">تولید، نصب و خدمات انواع کرکره برقی و درب اتوماتیک</p>
        
        <div class="services">
            <h2>خدمات و محصولات ما:</h2>
            <ul>
                <li>✔ کرکره برقی، تیغه‌های آلومینیومی و پانچ</li>
                <li>✔ درب‌های اتوماتیک و شیشه سکوریت</li>
                <li>✔ سایبان برقی و هوشمندسازی ساختمان</li>
            </ul>
        </div>

        <a href="tel:09121487861" class="btn-call">تماس با کارشناس: ۰۹۱۲۱۴۸۷۸۶۱</a>
    </div>
</body>
</html>
